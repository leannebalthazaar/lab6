<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Atlas Travel Co.</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>

<body class="min-vh-100 d-flex flex-column">

    <nav class="navbar md:navbar-expand bg-1">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Atlas Travel Co.</a>
    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
      <div class="drawer-header">
        <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
      </div>
      <div class="drawer-body mb-2 md:mb-0">
        <ul class="nav navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Our Destinations</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="contact.html">Contact Us</a>
          </li>
        </ul>
        <form class="hstack gap-2" role="search">
          <input class="form-control" type="search" placeholder="Search" aria-label="Search"/>
          <button class="btn-solid btn-icon theme-secondary" type="submit">
            <svg class="bi" width="16" height="16"><use href="#search" /></svg>
          </button>
        </form>
      </div>
    </dialog>
    </div>
    </nav>

<main>
    <div class="container mt-3">
        <form style="max-width: 900px" class="mx-auto">
        <div class="row g-4">

        <div class="form-field col-12 md:col-6">
        <label for="firstName" class="form-label">First name</label>
        <input type="text" class="form-control" id="firstName">
        </div>

        <div class="form-field col-12 md:col-6">
        <label for="lastName" class="form-label">Last name</label>
        <input type="text" class="form-control" id="lastName">
        </div>

        <div class="form-field col-12 md:col-6">
        <label for="fieldText" class="form-label">Email address</label>
        <input type="email" class="form-control" id="fieldText" placeholder="name@example.com">
        <div class="form-text">We’ll never share your email with anyone else.</div>
        </div>

        <div class="form-field col-12 md:col-6">
        <label for="reason" class="form-label">Reason for Contact</label>
        <select class="form-control" id="reason">
           <option>Please select one...</option>
           <option value="1">Booking a Trip, Activity, or Service</option>
           <option value="2">Question About Flights, Hotels, and Transportation</option>
           <option value="3">Feedback or Complaint</option>
           <option value="4">Other Inquiries</option>
        </select>
        </div>

        <div class="form-field col-12 md:col-6">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" rows="4"></textarea>
        </div>

        <div class="form-field col-12 md:col-6">
        <input type="checkbox" id="checkLabel" class="check" />
        <label for="checkLabel">I confirm that the information provided is accurate and consent to be contacted regarding my inquiry.</label>
        </div>

        <div class="col-12">
        <button class="btn-solid theme-primary mt-5">Submit Inquiry</button>
        </div>
        </div>
        </form>
    </div>
</main>

<footer class="mt-auto d-flex flex-wrap justify-content-center align-items-center gap-3 text-center p-5">
  <h4 class="fs-lg mb-0">&copy; 2026 Atlas Travel Co.</h4>
  <h4 class="fs-lg mb-0"><a class="fg-primary" href="contact.html">Contact Us</a></h4>
</footer>

</body>
</html>
